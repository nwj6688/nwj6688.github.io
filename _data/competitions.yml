- title: "智信—2026"无人智能挑战赛
  organizer: 中国指挥与控制学会
  description: >-
    2026年7月-10月举办。设两大竞赛项目。

    一、创新实践类（3个科目）
    聚焦无人集群智能管控和网络安全，需携带设备到指定地点参赛。报名截至8月31日，10月下旬决赛。

    二、创新创意类（7个科目）
    无人集群管控、道路巡检维护、AI仿真平台数据、AI智能开源情报、AI指挥控制、AI智能安全、新域反制。
    提交方案/论文/视频参赛。报名截至8月15日，8月下旬预赛→9月下旬决赛→10月下旬展示。
  status: 报名中
  deadline: 2026-08-31

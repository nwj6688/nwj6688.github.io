<meta charset="utf-8"/>
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- DNS Prefetch & Preconnect for faster CDN loading -->
<link rel="dns-prefetch" href="//cdn.jsdelivr.net">
<link rel="dns-prefetch" href="//code.jquery.com">
<link rel="dns-prefetch" href="//quantum-auto-safety.top">
<link rel="preconnect" href="https://quantum-auto-safety.top">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://code.jquery.com" crossorigin>

<!-- Content Security Policy -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://img.shields.io; connect-src 'self' https://quantum-auto-safety.top; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'">

<!-- Referrer Policy -->
<meta name="referrer" content="strict-origin-when-cross-origin">

<!-- RSS feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.url }}/feed.xml">

<!-- Bootstrap CSS (CDN) with SRI -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

<!-- baguetteBox lightbox CSS with SRI -->
<link href="https://cdn.jsdelivr.net/npm/baguettebox.js@1.11.1/dist/baguetteBox.min.css" rel="stylesheet" integrity="sha384-B5aNy5wNGHWnY3yY9JOpk08wOOIxBEl45JuhcjWfeCMyADAQQXX3+ZHA2jYMkSeh" crossorigin="anonymous">

<!-- 自定义样式表 -->
<link href="/css/style.css?v=2.0" rel="stylesheet" media="screen">

<!-- Favicon -->
<link rel="shortcut icon" href="/images/logo.png" type="image/png"/>

<!-- jQuery (CDN) with SRI -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha384-vtXRMe3mGCbOeY7l30aIg8H9p3GdeSe4IFlP6G8JMa7o7lXvnz3GFKzPxzJdPfGK" crossorigin="anonymous"></script>

<!-- Bootstrap JS (本地完整版，含 Modal/Collapse/Tab 等全部组件) -->
<script src="/js/bootstrap.bundle.min.js"></script>

<!-- Jekyll SEO tag -->
{% seo %}

<!-- JSON-LD Structured Data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchGroup",
  "name": "THETA Lab - Thorough Evaluation on Threats of AI",
  "alternateName": "北京交通大学人工智能安全实验室",
  "description": "北京交通大学人工智能安全实验室，隶属于网络空间安全学院，研究智能交通系统安全、大模型安全、图表示学习与威胁评估、强化学习与隐私保护、自动驾驶与车联网安全",
  "url": "{{ site.url }}",
  "parentOrganization": {
    "@type": "College",
    "name": "北京交通大学网络空间安全学院",
    "url": "https://scit.bjtu.edu.cn"
  },
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "email",
    "name": "牛温佳"
  }
}
</script>

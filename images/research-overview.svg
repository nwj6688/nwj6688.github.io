<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#3949ab"/>
    </linearGradient>
    <linearGradient id="cat1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00695c"/>
      <stop offset="100%" style="stop-color:#00897b"/>
    </linearGradient>
    <linearGradient id="cat2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#ef6c00"/>
    </linearGradient>
    <linearGradient id="cat3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <linearGradient id="cat4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b71c1c"/>
      <stop offset="100%" style="stop-color:#d32f2f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="500" fill="#f5f5f5" rx="16"/>

  <!-- 标题 -->
  <rect x="250" y="15" width="300" height="40" rx="20" fill="url(#core)"/>
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">THETA Lab 研究方向总览</text>

  <!-- 中心核心 -->
  <circle cx="400" cy="180" r="55" fill="url(#core)" opacity="0.95"/>
  <text x="400" y="170" text-anchor="middle" fill="#ffd54f" font-size="13" font-weight="bold">人工智能</text>
  <text x="400" y="188" text-anchor="middle" fill="#fff" font-size="12">安全研究</text>

  <text x="400" y="260" text-anchor="middle" fill="#666" font-size="11">智能交通 · 大模型 · 隐私保护</text>

  <!-- 第1组：AI核心技术（左上） -->
  <rect x="25" y="290" width="240" height="95" rx="10" fill="url(#cat1)" opacity="0.9"/>
  <text x="145" y="315" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">🤖 AI 核心技术</text>
  <line x1="45" y1="325" x2="245" y2="325" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <text x="145" y="345" text-anchor="middle" fill="#e0e0e0" font-size="11">• 强化学习应用与安全</text>
  <text x="145" y="363" text-anchor="middle" fill="#e0e0e0" font-size="11">• 图表示学习与威胁评估</text>
  <text x="145" y="381" text-anchor="middle" fill="#e0e0e0" font-size="11">• 大模型应用与安全</text>

  <!-- 第2组：智能交通（右上） -->
  <rect x="275" y="290" width="240" height="95" rx="10" fill="url(#cat2)" opacity="0.9"/>
  <text x="395" y="315" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">🚗 智能交通安全</text>
  <line x1="295" y1="325" x2="495" y2="325" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <text x="395" y="345" text-anchor="middle" fill="#e0e0e0" font-size="11">• 自动驾驶与车联网安全</text>
  <text x="395" y="363" text-anchor="middle" fill="#e0e0e0" font-size="11">• 智能交通系统安全</text>
  <text x="395" y="381" text-anchor="middle" fill="#e0e0e0" font-size="11">• 量子类脑智能汽车安全</text>

  <!-- 第3组：数据安全（左下） -->
  <rect x="25" y="395" width="240" height="95" rx="10" fill="url(#cat3)" opacity="0.9"/>
  <text x="145" y="420" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">🔐 数据与系统安全</text>
  <line x1="45" y1="430" x2="245" y2="430" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <text x="145" y="450" text-anchor="middle" fill="#e0e0e0" font-size="11">• 数据活动可信审计</text>
  <text x="145" y="468" text-anchor="middle" fill="#e0e0e0" font-size="11">• 知识图谱应用与安全</text>

  <!-- 第4组：工控安全（右下） -->
  <rect x="275" y="395" width="240" height="95" rx="10" fill="url(#cat4)" opacity="0.9"/>
  <text x="395" y="420" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold">🏭 工业与前沿安全</text>
  <line x1="295" y1="430" x2="495" y2="430" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <text x="395" y="450" text-anchor="middle" fill="#e0e0e0" font-size="11">• 工业操作系统安全治理</text>
  <text x="395" y="468" text-anchor="middle" fill="#e0e0e0" font-size="11">• AI应用与安全</text>

  <!-- 连接线 -->
  <line x1="400" y1="235" x2="145" y2="290" stroke="#00695c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="235" x2="395" y2="290" stroke="#e65100" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="235" x2="145" y2="395" stroke="#4a148c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="400" y1="235" x2="395" y2="395" stroke="#b71c1c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>

  <!-- 右边：应用场景 -->
  <rect x="550" y="290" width="225" height="200" rx="10" fill="#263238" opacity="0.9"/>
  <text x="662" y="315" text-anchor="middle" fill="#80cbc4" font-size="13" font-weight="bold">🎯 应用场景</text>
  <line x1="570" y1="325" x2="755" y2="325" stroke="#80cbc4" stroke-width="0.5" opacity="0.5"/>
  <text x="662" y="350" text-anchor="middle" fill="#b0bec5" font-size="11">🚄 铁路信号安全</text>
  <text x="662" y="375" text-anchor="middle" fill="#b0bec5" font-size="11">🚗 自动驾驶检测</text>
  <text x="662" y="400" text-anchor="middle" fill="#b0bec5" font-size="11">🏢 数据安全审计</text>
  <text x="662" y="425" text-anchor="middle" fill="#b0bec5" font-size="11">🔬 对抗攻防研究</text>
  <text x="662" y="450" text-anchor="middle" fill="#b0bec5" font-size="11">🛡️ 工业安全治理</text>
  <text x="662" y="475" text-anchor="middle" fill="#b0bec5" font-size="11">🧠 量子类脑计算</text>
</svg>